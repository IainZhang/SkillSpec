[project]
name = "skillspec"
version = "0.1.0"
description = "A specification-driven framework for detecting workflow and code defects in Agent Skill repositories"
requires-python = ">=3.13"
dependencies = [
    # OpenAI-compatible LLM client
    "openai>=2.53",
    # Data models / config
    "pydantic>=2.13",
    "pyyaml>=6",
    # Console UX (colors, tracebacks)
    "rich>=15",
    # Code analysis (tree-sitter; ABI-matched pins)
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-bash==0.25.1",
    "tiktoken>=0.13",
    # DAG visualization
    "graphviz>=0.21",
    # Verification sandbox driver: Harbor's Python API in-process (one warm container per skill)
    "harbor>=0.21,<0.22",
    # Phoenix tracing
    "arize-phoenix>=19",
    "openinference-instrumentation-openai>=0.1.53",
]

[project.scripts]
skillspec = "skillspec.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillspec"]

[tool.uv]
package = true
default-groups = ["dev"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
