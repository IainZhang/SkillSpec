llm:
  model: deepseek-v4-flash
  url: https://api.deepseek.com
  key_from_env: DEEPSEEK_API_KEY
  reasoning_effort: high
  concurrency: 30 
  max_retries: 3
  timeout: 600.0
  min_request_interval: 0.1

spec:
  enable: true
  fact_views: [self, neighbors, lineage, holistic]

verify:
  enable: true 
  sandbox:
    image: skillspec-sandbox:latest
    model: openrouter/x-ai/grok-4.6
    key_from_env: OPENROUTER_API_KEY
    timeout: 600.0

output:
  dir: ./dataset_result/flash
  log_level: info
  
telemetry:
  project: ds_flash
  enabled: true
  endpoint: http://localhost:6006/v1/traces
  api_key: Skadm9zQ4wRtVx2yLpN7bGmC3dHfJ8kU
